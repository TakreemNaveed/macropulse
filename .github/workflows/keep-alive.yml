name: Supabase Keep-Alive Ping

on:
  schedule:
    # Pings Supabase every 3 days at midnight UTC to prevent project pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcGV4aHlocXVldWNteHNzemVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNTE4NjksImV4cCI6MjEwOTcyNzg2OX0.5JdJlLW5lt21J22Saf_xYNvfrmNafoYHJcmdIGACgnI" \
            "https://kipexhyhqueucmxsszer.supabase.co/rest/v1/user_profiles?select=count")
          echo "Supabase responded with HTTP: $STATUS"
